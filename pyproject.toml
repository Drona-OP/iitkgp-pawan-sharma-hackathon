[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seismo"
version = "0.1.0"
description = "Seismo: an AI/NLP risk engine that turns news, filings and social posts into calibrated risk signals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pawan Sharma" }]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "websockets>=12.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "streamlit>=1.50",
  "plotly>=5.20",
  "pandas>=2.1",
]

[project.optional-dependencies]
ml = ["transformers>=4.44", "torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
