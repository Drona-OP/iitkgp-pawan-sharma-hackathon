name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SEISMO_SENTIMENT_BACKEND: lexicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .
      - name: Lint
        run: ruff check src tests scripts
      - name: Test (finance maths, replay packs, gate, modules, API)
        run: pytest
      - name: Replay smoke test (every pack, full pipeline)
        run: |
          for p in deepseek_2025 svb_2023 tariff_2025 red_team quiet_day; do
            python -m seismo replay --pack data/replay/$p.jsonl --speed 0 --reset
          done
      - name: Results bundle reproduces
        run: python -m seismo.eval.results > /dev/null
